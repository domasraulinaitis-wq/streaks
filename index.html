<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Streaks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">YOUR PROGRESS</div>
    <h1>Streaks</h1>
  </div>
  <button id="addBtn" class="round">+</button>
</header>

<main>
  <section id="todaySection">
    <div class="section-head">
      <div>
        <div class="eyebrow" id="todayLabel"></div>
        <h2>Today</h2>
      </div>
      <div class="today-score" id="todayScore"></div>
    </div>
    <div id="todayList"></div>
  </section>

  <section>
    <div class="section-head">
      <div>
        <div class="eyebrow">YOUR TRACKERS</div>
        <h2>Streaks</h2>
      </div>
    </div>
    <div id="streakList"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
